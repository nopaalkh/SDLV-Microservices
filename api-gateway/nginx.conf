# API Gateway Configuration for Digital Asset Marketplace

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/json;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;
    
    # Define upstream services
    upstream identity-service {
        server identity-service:3001;
    }
    
    upstream catalog-service {
        server catalog-service:3002;
    }
    
    upstream order-service {
        server order-service:3003;
    }
    
    server {
        listen 80;
        server_name localhost;

        # CORS headers
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

        # Handle preflight requests
        if ($request_method = OPTIONS) {
            return 204;
        }
        
        # Identity Service Routes
        location /api/auth {
            proxy_pass http://identity-service/api/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Catalog Service Routes
        location /api/assets {
            proxy_pass http://catalog-service/api/assets;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Order Service Routes
        # Block internal routes from external access
        location ^~ /api/orders/internal {
            return 404;
        }

        location /api/orders {
            proxy_pass http://order-service/api/orders;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Withdrawal Routes (Order Service)
        location /api/withdrawals {
            proxy_pass http://order-service/api/withdrawals;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin Routes - Identity Service (User Management)
        location /api/admin/users {
            proxy_pass http://identity-service/api/admin/users;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin Routes - Catalog Service (Asset Moderation)
        location /api/admin/assets {
            proxy_pass http://catalog-service/api/admin/assets;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin Routes - Order Service (Order Monitoring)
        location /api/admin/orders {
            proxy_pass http://order-service/api/admin/orders;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin Routes - Withdrawal Management
        location /api/admin/withdrawals {
            proxy_pass http://order-service/api/admin/withdrawals;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Health Check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
        
        # Swagger API Documentation
        location /docs/ {
            alias /usr/share/nginx/html/swagger/;
            index index.html;
            add_header Cache-Control "no-cache";
        }

        location /docs {
            return 301 /docs/;
        }

        # Root redirect to docs
        location = / {
            return 301 /docs/;
        }
    }
}