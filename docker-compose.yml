# Docker Compose for Digital Asset Marketplace
services:
  # API Gateway
  api-gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/nginx.conf
      - ./api-gateway/swagger:/usr/share/nginx/html/swagger
    depends_on:
      - identity-service
      - catalog-service
      - order-service
    networks:
      - dam-network

  # Identity Service
  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
    env_file:
      - ./services/identity-service/.env
    environment:
      - PORT=3001
    depends_on:
      identity-db:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - dam-network

  # Catalog Service
  catalog-service:
    build:
      context: ./services/catalog-service
      dockerfile: Dockerfile
    env_file:
      - ./services/catalog-service/.env
    environment:
      - PORT=3002
      - ORDER_SERVICE_URL=http://order-service:3003
    depends_on:
      catalog-db:
        condition: service_healthy
    networks:
      - dam-network

  # Order Service
  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    env_file:
      - ./services/order-service/.env
    environment:
      - PORT=3003
      - IDENTITY_SERVICE_URL=http://identity-service:3001
      - CATALOG_SERVICE_URL=http://catalog-service:3002
    depends_on:
      order-db:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - dam-network

  # Databases
  identity-db:
    image: postgres:15-alpine
    env_file:
      - ./services/identity-service/.env
    volumes:
      - identity-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dam-network

  catalog-db:
    image: postgres:15-alpine
    env_file:
      - ./services/catalog-service/.env
    volumes:
      - catalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dam-network

  order-db:
    image: postgres:15-alpine
    env_file:
      - ./services/order-service/.env
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dam-network

  # Mailhog for mock email testing
  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP
    networks:
      - dam-network



# Volumes
volumes:
  identity-db-data:
  catalog-db-data:
  order-db-data:

    # Networks
networks:
  dam-network:
    driver: bridge
